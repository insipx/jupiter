name: kasa-exporter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/insipx/jupiter/kasa-exporter

jobs:
  # Build each arch NATIVELY on its own runner (no cross), push an arch-suffixed
  # tag per arch; a follow-up job stitches them into a manifest list so the
  # mixed-arch k3s cluster pulls the right image on any node.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-substituters = https://insipx.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = insipx.cachix.org-1:JMvQq3zItXN5AO7VfPUAILAwMXQrzQ78rLoQTktWs14= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            access-tokens = github.com=${{ secrets.SECRETS_PAT }}

      - uses: cachix/cachix-action@v17
        with:
          name: insipx
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build kasa-exporter image (${{ matrix.arch }})
        run: nix build .#kasa-exporter-image --print-out-paths > image-path.txt

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.arch }} image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker load < "$(cat image-path.txt)"
          docker tag kasa-exporter:latest ${IMAGE}:${SHORT_SHA}-${{ matrix.arch }}
          docker push ${IMAGE}:${SHORT_SHA}-${{ matrix.arch }}

  manifest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push multi-arch manifest
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for TAG in latest ${SHORT_SHA}; do
            docker buildx imagetools create -t ${IMAGE}:${TAG} \
              ${IMAGE}:${SHORT_SHA}-amd64 \
              ${IMAGE}:${SHORT_SHA}-arm64
          done
