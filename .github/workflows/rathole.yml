name: rathole

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/insipx/jupiter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: rathole-server
            attr: rathole-server-image
            arch: amd64
          - image: rathole-client
            attr: rathole-client-image
            arch: amd64
          - image: rathole-client
            attr: rathole-client-image-aarch64
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-substituters = https://insipx.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = insipx.cachix.org-1:JMvQq3zItXN5AO7VfPUAILAwMXQrzQ78rLoQTktWs14= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            access-tokens = github.com=${{ secrets.SECRETS_PAT }}

      - uses: cachix/cachix-action@v17
        with:
          name: insipx
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ${{ matrix.image }} (${{ matrix.arch }})
        run: nix build .#${{ matrix.attr }} --print-out-paths > image-path.txt

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.image }}:${{ matrix.arch }} to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker load < "$(cat image-path.txt)"
          docker tag ${{ matrix.image }}:latest \
            ${IMAGE_PREFIX}/${{ matrix.image }}:${SHORT_SHA}-${{ matrix.arch }}
          docker push ${IMAGE_PREFIX}/${{ matrix.image }}:${SHORT_SHA}-${{ matrix.arch }}

  # The client runs on the mixed-arch k3s cluster, so its two arch builds are
  # stitched into one manifest list and the kubelet picks per node. The server
  # only ever runs on fly.io (amd64), so its single arch is republished as-is.
  manifest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push rathole-client multi-arch manifest
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE=${IMAGE_PREFIX}/rathole-client
          for TAG in latest ${SHORT_SHA}; do
            docker buildx imagetools create -t ${IMAGE}:${TAG} \
              ${IMAGE}:${SHORT_SHA}-amd64 \
              ${IMAGE}:${SHORT_SHA}-arm64
          done

      - name: Push rathole-server tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE=${IMAGE_PREFIX}/rathole-server
          for TAG in latest ${SHORT_SHA}; do
            docker buildx imagetools create -t ${IMAGE}:${TAG} \
              ${IMAGE}:${SHORT_SHA}-amd64
          done
