# Rathole Server Configuration
#
# Copy to rathole-server.toml, fill in the token and key, then push it as a
# fly secret. [[files]] base64-DECODES the secret, so it must be encoded --
# and macos `base64` wraps its output, which corrupts it, hence the tr:
#
#   fish: fly secrets set RATHOLE_CONFIG=(base64 < rathole-server.toml | tr -d '\n') -a jupiter-gateway
#   bash: fly secrets set RATHOLE_CONFIG=$(base64 < rathole-server.toml | tr -d '\n') -a jupiter-gateway
#
# Secrets only reach [[files]] on a NEW machine, so `fly deploy` after setting.
#
# The token must be literal text here -- rathole has no env-var interpolation.
# Keep the canonical copy in jupiter-secrets/secrets/homelab.yaml so this and
# the cluster-side client.toml cannot drift.

[server]
bind_addr = "0.0.0.0:2333"
default_token = "YOUR_SECRET_TOKEN_HERE"

heartbeat_interval = 30

[server.transport]
type = "noise"

[server.transport.noise]
local_private_key = "SERVER_PRIVATE_KEY_BASE64"

[server.services.public]
bind_addr = "0.0.0.0:8445"
